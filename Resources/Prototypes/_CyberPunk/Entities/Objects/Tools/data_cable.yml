- type: entity
  parent: CableStack
  id: CableDataStack
  name: data cable coil
  suffix: Full
  description: Data cable, for joining networked machines to switches and routers.
  components:
  - type: Stack
    stackType: CableData
    baseLayer: base
    layerStates:
    - coil-10
    - coil-20
    - coil-30
  - type: Sprite
    color: Cyan
    state: coil-30
    layers:
    - state: coil-30
      map: [ "base" ]
  - type: Item
    heldPrefix: coillv
  - type: CablePlacer
    cablePrototypeID: CableData
    blockingWireType: Data

- type: entity
